name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - run: uv sync --frozen --group dev
      - run: uv run oarbank-sdk check examples/toy/oarbank-module.toml
      - run: uv run pytest -q
      - name: schemas, reference, vectors and the compatibility table are fresh
        run: |
          uv run oarbank-sdk export-schemas
          uv run python scripts/gen_vectors.py
          uv run python scripts/gen_compatibility.py
          git diff --exit-code
  docs:
    # Builds the docs site with every gate except the private hygiene terms, which
    # only the deploy (Cloudflare Workers Builds, on main) has.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "commit $c is not signed off"; exit 1; }
          done
