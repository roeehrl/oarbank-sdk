[project]
name = "oarbank-sdk"
version = "1.5.0"
description = "Open SDK, protocol specs and JSON Schemas for building oarbank job modules"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "jsonschema>=4.23",
    "jinja2>=3.1",          # the published UI renderer
]

[project.scripts]
oarbank-sdk = "oarbank_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oarbank_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "oarbank_sdk/_data/schemas"
"spec" = "oarbank_sdk/_data/spec"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
